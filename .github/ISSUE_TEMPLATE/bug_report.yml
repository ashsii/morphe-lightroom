name: Bug report
description: Report a problem with the Lightroom patch bundle.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        [Search existing issues](https://github.com/ashsii/morphe-lightroom/issues?q=is%3Aissue) before reporting a bug.
        Read [CONTRIBUTING.md](https://github.com/ashsii/morphe-lightroom/blob/main/CONTRIBUTING.md) for the supported target and validation steps.
        Redact account details, tokens, and photo paths. Do not attach APKs.
  - type: textarea
    id: environment
    attributes:
      label: App and patch environment
      description: Include the package name, app version and version code, architecture, Android version, Morphe client version, bundle version, and selected patches.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Describe the steps, expected behavior, and actual result.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste patcher errors or relevant device logs after removing private information.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include any workaround or suspected cause.
