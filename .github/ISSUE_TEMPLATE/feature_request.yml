name: Feature request
description: Suggest an improvement to the Lightroom patch bundle.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        [Search existing issues](https://github.com/ashsii/morphe-lightroom/issues?q=is%3Aissue) before making a request.
        Include the Lightroom version and architecture relevant to your request.
        Do not attach APKs or private account information.
  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: Describe the behavior you would like and any useful examples.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Use case
      description: Explain the problem this solves and any current workaround.
    validations:
      required: true
